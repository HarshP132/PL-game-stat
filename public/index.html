<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PL 3D Stat Visualiser</title>
  <link rel="stylesheet" href="/styles.css" />
  <script>
    // Startup watchdog: if the app hasn't started after a few seconds, explain why on screen
    // instead of leaving the page stuck on "Connecting…".
    (function () {
      function fail(html) {
        var box = document.getElementById('boot-error');
        box.innerHTML = html;
        box.hidden = false;
        var pill = document.getElementById('source');
        pill.className = 'pill warn';
        pill.textContent = 'Problem starting – see message';
      }
      window.__plFail = fail;
      window.addEventListener('error', function (e) {
        if (!window.__plStarted) fail('<b>The app hit an error while starting.</b><br><code>' + String(e.message || 'Unknown error').replace(/</g, '&lt;') + '</code>');
      });
      setTimeout(function () {
        if (window.__plStarted) return;
        var files = ['/js/main.js', '/js/scene.js', '/vendor/three/build/three.module.js', '/vendor/three/examples/jsm/controls/OrbitControls.js'];
        Promise.all(files.map(function (f) {
          return fetch(f, { cache: 'no-store' }).then(function (r) { return f + ' → ' + r.status; }, function () { return f + ' → could not load'; });
        })).then(function (lines) {
          fail('<b>The app didn\'t start.</b> Try a hard refresh (Ctrl+Shift+R, or Cmd+Shift+R on a Mac). If that doesn\'t help, send this to whoever set up the site:<br><code>' + lines.join('<br>') + '<br>' + navigator.userAgent + '</code>');
        });
      }, 8000);
    })();
  </script>
</head>
<body>
  <div id="stage"></div>

  <header class="topbar">
    <div class="brand">⚽ <span>PL</span> 3D Stat Visualiser</div>
    <div class="views" role="group" aria-label="Camera">
      <button data-view="broadcast" class="active">Broadcast</button>
      <button data-view="top">Top-down</button>
      <button data-view="goal">Behind goal</button>
      <button data-view="timeline">Timeline</button>
      <button id="orbit" aria-pressed="false">Auto-orbit</button>
    </div>
    <div id="source" class="pill">Connecting…</div>
  </header>

  <aside class="panel left" id="browser">
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="live" class="active">Live</button>
      <button role="tab" data-tab="results">Results</button>
      <button role="tab" data-tab="demo">Demo</button>
    </div>
    <div class="tab-tools" id="tools"></div>
    <ul class="fixtures" id="fixtures"></ul>
  </aside>

  <aside class="panel right" id="details">
    <div class="match-head" id="matchHead"><p class="muted">Pick a match to visualise.</p></div>
    <section>
      <h3>Match stats</h3>
      <div id="stats"></div>
    </section>
    <section>
      <h3>Key moments</h3>
      <ol id="events" class="events"></ol>
    </section>
    <p class="note" id="note"></p>
  </aside>

  <button class="panel-toggle left" data-target="browser" aria-label="Toggle match list">☰</button>
  <button class="panel-toggle right" data-target="details" aria-label="Toggle stats">📊</button>

  <div id="boot-error" class="boot-error" role="alert" hidden></div>
  <div id="tooltip" class="tooltip" hidden></div>
  <div id="goal-banner" class="goal-banner" hidden>GOAL!</div>
  <div class="legend">Hover anything in 3D · drag to orbit · scroll to zoom</div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
